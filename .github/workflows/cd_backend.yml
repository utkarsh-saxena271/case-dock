name: Deploy the backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy backend to EC2
    runs-on: ubuntu-latest
    steps:
      - name: SSH into server and deploy
        run: |
          echo "${{ secrets.SSH_PVT_KEY }}" > ~/file.pem
          chmod 600 ~/file.pem
          ssh -i ~/file.pem -o StrictHostKeyChecking=no ubuntu@${{ secrets.VM_IP }} << 'EOF'
            cd case-dock/backend
            git fetch origin
            git reset --hard origin/main
            rm -rf node_modules
            npm ci
            npx prisma generate
            npx prisma migrate deploy
            npm run build
            which pm2
            pm2 restart backend
          EOF